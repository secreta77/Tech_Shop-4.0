<header class="header">
  <div class="header__inner">
    <a routerLink="/" class="logo">
      <span class="logo__icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="7" width="18" height="13" rx="2" />
          <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        </svg>
      </span>
      <span class="logo__text">STEP TECH</span>
    </a>

    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        >Home</a
      >
      <a routerLink="/shop" routerLinkActive="active">Shop</a>
    </nav>

    <input type="search" class="search" placeholder="Search products..." />

    @if (isLoggedIn()) {
      <div class="actions">
        <button type="button" class="icon-btn" aria-label="Favorites">
          <i class="bi bi-heart"></i>
        </button>
        <button type="button" class="icon-btn" aria-label="Cart" (click)="cartOpen.set(true)">
          <i class="bi bi-cart"></i>
          @if (cartCount() > 0) {
            <span class="icon-btn__badge">{{ cartCount() }}</span>
          }
        </button>
        <span class="avatar">{{ initials() }}</span>
        <button type="button" class="logout" (click)="logout()">Logout</button>
      </div>

      <app-cart-drawer
      [open]="cartOpen()"
      [items]="cartItems()"
      [count]="cartCount()"
      [total]="cartTotal()"
      (closed)="cartOpen.set(false)"
      (quantityChange)="changeQuantity($event)"
      (removed)="removeFromCart($event)"
    />
    } @else {
      <a routerLink="/login" class="sign-in">Sign In</a>
    }
  </div>
</header>
