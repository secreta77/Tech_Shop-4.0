<article class="review" [class.review--mine]="isMine()">
    @if (review().user.details.pictureUrl) {
      <img class="review__avatar" [src]="review().user.details.pictureUrl" [alt]="fullName()" />
    } @else {
      <div class="review__avatar review__avatar--initial">{{ initial() }}</div>
    }
  
    <div class="review__info">
      <p class="review__name">
      {{ fullName() }}
      @if (isMine()) {
        <span class="review__badge">You</span>
      }
    </p>
      <p class="review__date">{{ review().createdAt | date: 'longDate' }}</p>
    </div>
  
    <div class="review__stars">
      @for (star of stars; track star) {
        <span class="star" [class.star--filled]="star <= review().rating">★</span>
      }
    </div>
  </article>
