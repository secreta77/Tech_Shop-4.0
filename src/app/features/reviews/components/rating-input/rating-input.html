<div class="rating" (mouseleave)="hovered.set(0)">
    @for (star of stars; track star) {
      <button
        type="button"
        class="rating__star"
        [class.rating__star--filled]="star <= (hovered() || value())"
        (mouseenter)="hovered.set(star)"
        (click)="rated.emit(star)"
      >
        ★
      </button>
    }
  </div>
