@if (isLoggedIn()) {
  <div class="actions">
    <button type="button" class="write-btn" (click)="formOpen.set(true)">
      <i class="bi bi-pencil-square"></i> {{ myReview() ? 'Edit Your Review' : 'Write a Review' }}
    </button>
  </div>
} @else {
  <div class="login-note">
    Please <a routerLink="/login">login</a> to write a review.
  </div>
}

<app-reviews-summary [reviews]="reviews()" />

<div class="reviews">
  @for (review of orderedReviews(); track review.id) {
    <app-review-card [review]="review" [isMine]="review.id === myReview()?.id" />
  }
</div>

@if (formOpen()) {
  <app-review-form
    [isEdit]="!!myReview()"
    [initialRating]="myReview()?.rating ?? 0"
    [submitting]="saving()"
    (submitted)="onSubmit($event)"
    (cancelled)="formOpen.set(false)"
  />
}
