<section class="shop-hero">
  <div class="container">
    <h1>All Products</h1>
    <p>Discover our full range of tech products</p>
  </div>
</section>

<section class="container shop-layout">
  <app-shop-filters
  [categories]="categories()"
  [selectedCategory]="categoryId()"
  [minRating]="minRating()"
  [minPrice]="minPrice()"
  [maxPrice]="maxPrice()"
  [brand]="brand()"
  [inStock]="inStock()"
  (categoryChange)="filterChange({ category: $event })"
  (ratingChange)="filterChange({ rating: $event })"
  (minPriceChange)="filterChange({ minPrice: $event })"
  (maxPriceChange)="filterChange({ maxPrice: $event })"
  (brandChange)="filterChange({ brand: $event })"
  (inStockChange)="filterChange({ inStock: $event || null })"
  (cleared)="clearFilters()"
/>

  <div class="shop-results">
    <div class="shop-toolbar">
      <div class="shop-toolbar__search">
        <i class="bi bi-search"></i>
        <input
          type="search"
          placeholder="Search products..."
          [value]="search()"
          (input)="onSearch($event)"
        />
      </div>

      <p class="shop__count">{{ totalCount() }} products</p>
    </div>

    <div class="shop__grid">
      @for (product of products(); track product.id; let isFirst = $first) {
        <app-product-card [product]="product" [priority]="isFirst" />
      }
    </div>

    <app-pagination
      [currentPage]="page()"
      [totalPages]="totalPages()"
      [pageSize]="pageSize()"
      (pageChange)="changePage($event)"
      (pageSizeChange)="changePageSize($event)"
    />
  </div>
</section>
