<section class="hero">
    <div class="hero__background">
      <div class="hero__grid"></div>
      <div class="hero__glow"></div>
    </div>
  
    <div class="hero__content">
      <div>
        <span class="hero__badge"><i class="bi bi-lightning-charge"></i> New Arrivals</span>
  
        <h1 class="hero__title">
          Discover the Future of <span class="hero__highlight">Technology</span>
        </h1>
  
        <p class="hero__text">
          Shop the latest smartphones, laptops, and cutting-edge electronics from top brands. Free
          shipping on orders over $100.
        </p>
  
        <div class="hero__actions">
          <a routerLink="/shop" class="hero__btn hero__btn--primary">
            Shop Now <i class="bi bi-arrow-right"></i>
          </a>
          <a routerLink="/shop" class="hero__btn hero__btn--secondary">View New Arrivals</a>
        </div>
      </div>
  
      <div class="hero__image">
        <img
          class="hero__device"
          ngSrc="images/hero-banner.png"
          alt="Headphones"
          width="300"
          height="468"
          priority
        />
        <div class="hero__chip hero__chip--1"><i class="bi bi-phone"></i> Smartphones</div>
        <div class="hero__chip hero__chip--2"><i class="bi bi-laptop"></i> Laptops</div>
        <div class="hero__chip hero__chip--3"><i class="bi bi-headphones"></i> Audio</div>
      </div>
    </div>
  </section>
