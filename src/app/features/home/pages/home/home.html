<section class="section">
    <div class="container">
      <div class="section__head">
        <div>
          <h2>Shop by Category</h2>
          <p>Browse our wide selection of tech categories</p>
        </div>
        <a routerLink="/shop" class="view-all">View All</a>
      </div>
  
      <div class="categories">
        @for (category of featuredCategories(); track category.id) {
          <app-category-card [category]="category" />
        }
      </div>
    </div>
  </section>
  
  <section class="section section--gray">
    <div class="container">
      <div class="section__head">
        <div>
          <h2>Featured Products</h2>
          <p>Handpicked tech essentials just for you</p>
        </div>
        <a routerLink="/shop" class="view-all">View All</a>
      </div>
  
      <div class="products">
        @for (product of products(); track product.id) {
            <app-product-card [product]="product" />
        }
      </div>
    </div>
  </section>
