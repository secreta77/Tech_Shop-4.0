<div class="backdrop" [class.backdrop--open]="open()" (click)="closed.emit()"></div>

<aside class="drawer" [class.drawer--open]="open()">
  <div class="drawer__header">
    <h2>Shopping Cart ({{ count() }} {{ count() === 1 ? 'item' : 'items' }})</h2>
    <button type="button" class="drawer__close" aria-label="Close" (click)="closed.emit()">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <div class="drawer__body">
    @for (item of items(); track item.id) {
      <app-cart-item
        [item]="item"
        (quantityChange)="quantityChange.emit({ itemId: item.id, quantity: $event })"
        (removed)="removed.emit(item.id)"
      />
    } @empty {
      <p class="drawer__empty">Your cart is empty</p>
    }
  </div>

  @if (items().length) {
    <div class="drawer__footer">
      <div class="drawer__row">
        <span>Subtotal</span>
        <span>USD {{ total() | number: '1.0-0' }}</span>
      </div>
      <div class="drawer__row drawer__row--total">
        <span>Total</span>
        <span>USD {{ total() | number: '1.0-0' }}</span>
      </div>

      <a routerLink="/profile/cart" class="drawer__button drawer__button--outline" (click)="closed.emit()">
        View Cart
      </a>
      <a routerLink="/profile/cart" class="drawer__button drawer__button--primary" (click)="closed.emit()">
        Checkout
      </a>
    </div>
  }
</aside>
