<div class="item">
    <div class="item__image">
      <img [ngSrc]="item().product.imageUrl" [alt]="item().product.name" fill />
    </div>
  
    <div class="item__info">
      <p class="item__name">{{ item().product.name }}</p>
      <p class="item__price">USD {{ item().price | number: '1.0-0' }}</p>
  
      <div class="item__qty">
        <button
          type="button"
          aria-label="Decrease"
          [disabled]="item().quantity <= 1"
          (click)="quantityChange.emit(item().quantity - 1)"
        >
          −
        </button>
        <span>{{ item().quantity }}</span>
        <button
          type="button"
          aria-label="Increase"
          [disabled]="item().quantity >= item().product.stock"
          (click)="quantityChange.emit(item().quantity + 1)"
        >
          +
        </button>
      </div>
    </div>
  
    <div class="item__side">
      <button type="button" class="item__remove" aria-label="Remove" (click)="removed.emit()">
        <i class="bi bi-trash"></i>
      </button>
      <p class="item__total">USD {{ item().totalPrice | number: '1.0-0' }}</p>
    </div>
  </div>
