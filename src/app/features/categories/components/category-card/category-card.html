<div class="card">
    <img [ngSrc]="category().imageUrl" [alt]="category().name" [priority]="priority()" width="64" height="64" />
    <div class="category__text">
        <h2>{{category().name}}</h2>
        <p>{{category().productCount}}</p>
    </div>
    <span class="card__arrow">→</span>
</div>
