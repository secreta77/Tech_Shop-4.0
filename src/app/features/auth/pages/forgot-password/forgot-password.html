<app-auth-layout
  brandTitle="Reset Your Password"
  icon="bi bi-lock"
  title="Forgot Password?"
  subtitle="Enter your email and we'll send you a reset link"
  description="Don't worry! We'll help you get back into your account in no time."
  [features]="features"
>
  <form [formRoot]="forgotForm" class="form">
    <div class="field">
      <label for="email" class="sr-only">Email</label>
      <div class="input">
        <i class="bi bi-envelope"></i>
        <input type="email" id="email" placeholder="Email address" [formField]="forgotForm.email" />
      </div>
      @if (forgotForm.email().touched()) {
        @for (error of forgotForm.email().errors(); track error.kind) {
          <p class="error">{{ error.message }}</p>
        }
      }
    </div>

    <button type="submit" class="btn-primary" [disabled]="forgotForm().submitting()">
      <i class="bi bi-send"></i>
      @if (forgotForm().submitting()) {
        Sending...
      } @else {
        Send Reset Link
      }
    </button>

    <p class="form-footer">
      <a routerLink="/login" class="link"><i class="bi bi-arrow-left"></i> Back to Login</a>
    </p>
  </form>
</app-auth-layout>
