<app-auth-layout
  icon="bi bi-envelope-check"
  title="Verify your email"
  [subtitle]="email ? 'We sent a code to ' + email : 'No email provided'"
  description="One last step to activate your account and start shopping."
  [features]="features"
>
  @if (email) {
    <form [formRoot]="verifyFrom" class="form">
      <div class="field">
        <label for="code" class="sr-only">Verification code</label>
        <div class="input">
          <i class="bi bi-key"></i>
          <input type="text" id="code" placeholder="Verification code" [formField]="verifyFrom.code" />
        </div>
        @if (verifyFrom.code().touched()) {
          @for (error of verifyFrom.code().errors(); track error.kind) {
            <p class="error">{{ error.message }}</p>
          }
        }
      </div>

      <button type="submit" class="btn-primary" [disabled]="verifyFrom().submitting()">
        @if (verifyFrom().submitting()) {
          Verifying...
        } @else {
          Verify
        }
      </button>

      <p class="form-footer">
        Didn't get a code? <button type="button" class="link" (click)="resend()">Resend</button>
      </p>
    </form>
  } @else {
    <p class="form-footer">
      <a routerLink="/register" class="link">Go to Register</a>
    </p>
  }
</app-auth-layout>
