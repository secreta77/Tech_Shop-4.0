<h1>Verify Your Email</h1>

@if (email) {
  <p>We sent a verification code to <strong>{{ email }}</strong></p>

  <form [formRoot]="verifyFrom" class="form">
    <div class="field">
      <label for="code">Verification Code</label>
      <input type="text" id="code" [formField]="verifyFrom.code" />
      @if (verifyFrom.code().touched()) {
        @for (error of verifyFrom.code().errors(); track error.kind) {
          <p class="error">{{ error.message }}</p>
        }
      }
    </div>

    <button type="submit" [disabled]="verifyFrom().submitting()">
      @if (verifyFrom().submitting()) {
        Verifying...
      } @else {
        Verify
      }
    </button>
  </form>

  <p>Didn't get a code? <button type="button" class="link" (click)="resend()">Resend</button></p>
} @else {
  <p>No email provided. <a routerLink="/register">Go to Register</a></p>
}
