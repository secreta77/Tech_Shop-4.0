<app-auth-layout
  icon="bi bi-box-arrow-in-right"
  title="Welcome Back"
  subtitle="Sign in to continue shopping"
  description="Access exclusive deals and manage your orders with your account."
  [stats]="stats"
>
  <form [formRoot]="loginForm" class="form">
    <div class="field">
      <label for="email" class="sr-only">Email</label>
      <div class="input">
        <i class="bi bi-envelope"></i>
        <input type="email" id="email" placeholder="Email address" [formField]="loginForm.email" />
      </div>
      @if (loginForm.email().touched()) {
        @for (error of loginForm.email().errors(); track error.kind) {
          <p class="error">{{ error.message }}</p>
        }
      }
    </div>

    <div class="field">
      <label for="password" class="sr-only">Password</label>
      <div class="input">
        <i class="bi bi-lock"></i>
        <input type="password" id="password" placeholder="Password" [formField]="loginForm.password" />
      </div>
      @if (loginForm.password().touched()) {
        @for (error of loginForm.password().errors(); track error.kind) {
          <p class="error">{{ error.message }}</p>
        }
      }
    </div>

    <div class="form__options">
      <label class="checkbox">
        <input type="checkbox" [formField]="loginForm.remember" />
        Remember me
      </label>
    </div>

    <button type="submit" class="btn-primary" [disabled]="loginForm().submitting()">
      @if (loginForm().submitting()) {
        Signing in...
      } @else {
        Sign In
      }
    </button>

    <div class="divider">or</div>

    <p class="form-footer">
      Don't have an account? <a routerLink="/register" class="link">Create one now</a>
    </p>
  </form>
</app-auth-layout>
