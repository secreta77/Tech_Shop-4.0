<h1>Sign In</h1>

<form [formRoot]="loginForm" class="form">
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" [formField]="loginForm.email" />
    @if (loginForm.email().touched()) {
      @for (error of loginForm.email().errors(); track error.kind) {
        <p class="error">{{ error.message }}</p>
      }
    }
  </div>

  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" [formField]="loginForm.password" />
    @if (loginForm.password().touched()) {
      @for (error of loginForm.password().errors(); track error.kind) {
        <p class="error">{{ error.message }}</p>
      }
    }
  </div>

  <label class="checkbox">
    <input type="checkbox" [formField]="loginForm.remember" />
    Remember me
  </label>

  <button type="submit" [disabled]="loginForm().submitting()">
    @if (loginForm().submitting()) {
      Signing in...
    } @else {
      Sign In
    }
  </button>
</form>

<p>Don't have an account? <a routerLink="/register">Create one</a></p>
